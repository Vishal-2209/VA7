name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install hatchling

      - name: Build va7-core
        run: python -m hatchling build --target wheel
        working-directory: packages/va7-core

      - name: Build va7-identity
        run: python -m hatchling build --target wheel
        working-directory: packages/va7-identity

      - name: Publish va7-core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/va7-core/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish va7-identity
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/va7-identity/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
