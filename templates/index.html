<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>va7.dev | System under development</title>
    <style>
        :root {
            --bg: #030303;
            --fg: #fcfcfc;
            --fg-muted: #888888;
            --border: #222222;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg: #ffffff;
                --fg: #050505;
                --fg-muted: #777777;
                --border: #e0e0e0;
            }
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg);
            color: var(--fg);
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            letter-spacing: -0.01em;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ambient grain */
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
            opacity: 0.04;
            background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
        }

        @media (prefers-color-scheme: light) {
            .noise { opacity: 0.03; }
        }

        /* 
           UI Frame Elements 
           Adds architectural structure to the page edges without cluttering the center 
        */
        .frame {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            padding: 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.7rem;
            color: var(--fg-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            z-index: 10;
        }

        .frame-top, .frame-bottom {
            display: flex;
            justify-content: space-between;
        }
        
        .frame span {
            opacity: 0;
            animation: fade-in 1.5s ease 1s forwards;
        }

        /* Minimalist crosshairs in the corners */
        .crosshair {
            position: absolute;
            width: 20px;
            height: 20px;
            opacity: 0;
            animation: fade-in 2s ease 0.5s forwards;
        }
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background: var(--border);
        }
        .crosshair::before { top: 10px; left: 0; width: 20px; height: 1px; }
        .crosshair::after { top: 0; left: 10px; width: 1px; height: 20px; }
        
        .ch-tl { top: 32px; left: 32px; }
        .ch-tr { top: 32px; right: 32px; }
        .ch-bl { bottom: 32px; left: 32px; }
        .ch-br { bottom: 32px; right: 32px; }

        /* A subtle line connecting everything vertically */
        .vertical-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 1px;
            background: linear-gradient(to bottom, transparent, var(--border), transparent);
            opacity: 0;
            animation: fade-in 2.5s ease 0.8s forwards;
            pointer-events: none;
            z-index: 0;
        }

        /* Center content */
        .container {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 800px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        /* Abstract elegant geometric element */
        .geo-logo {
            width: 56px;
            height: 56px;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(15px) rotate(-45deg);
            animation: logo-in 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .geo-logo svg {
            width: 100%;
            height: 100%;
            stroke: var(--fg);
            fill: none;
            stroke-width: 1.5;
        }

        @keyframes logo-in {
            to { opacity: 1; transform: translateY(0) rotate(0deg); }
        }

        .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--fg-muted);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 999px;
            display: inline-block;
            font-weight: 500;
            opacity: 0;
            transform: translateY(15px);
            animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            background-color: var(--bg); /* To cover the vertical line behind it */
        }

        h1 {
            font-size: clamp(3.5rem, 10vw, 7rem);
            font-weight: 300; /* Ultra clean and light */
            margin: 0;
            line-height: 0.9;
            letter-spacing: -0.06em;
            opacity: 0;
            transform: translateY(20px);
            animation: fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
            background-color: var(--bg);
            padding: 0 10px;
        }

        p {
            font-size: 1.125rem;
            color: var(--fg-muted);
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
            font-weight: 400;
            opacity: 0;
            transform: translateY(15px);
            animation: fade-up 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            background-color: var(--bg);
        }

        @keyframes fade-up {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in {
            to { opacity: 1; }
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .frame {
                padding: 16px;
                font-size: 0.6rem;
            }
            .ch-tl { top: 16px; left: 16px; }
            .ch-tr { top: 16px; right: 16px; }
            .ch-bl { bottom: 16px; left: 16px; }
            .ch-br { bottom: 16px; right: 16px; }
            
            h1 {
                font-size: clamp(2.5rem, 15vw, 4rem);
            }
            
            p {
                font-size: 1rem;
                padding: 0 16px;
            }
            
            .geo-logo {
                width: 48px;
                height: 48px;
            }
        }
        
    </style>
</head>
<body>
    <div class="noise"></div>
    <div class="vertical-line"></div>
    
    <!-- Architectural framing elements -->
    <div class="crosshair ch-tl"></div>
    <div class="crosshair ch-tr"></div>
    <div class="crosshair ch-bl"></div>
    <div class="crosshair ch-br"></div>
    
    <!-- Corner Metadata -->
    <div class="frame">
        <div class="frame-top">
            <span>VA7 // Core</span>
            <span id="time">00:00:00</span>
        </div>
        <div class="frame-bottom">
            <span>v 1.0.0-beta</span>
            <span>Status: Standby</span>
        </div>
    </div>
    
    <div class="container">
        <!-- Minimalist geometric icon (compass/target abstract) -->
        <div class="geo-logo">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke-dasharray="2 6"></circle>
                <circle cx="50" cy="50" r="22"></circle>
                <line x1="50" y1="0" x2="50" y2="100"></line>
                <line x1="0" y1="50" x2="100" y2="50"></line>
            </svg>
        </div>
        
        <div class="label">System Under Development</div>
        <h1>va7.dev</h1>
        <p>A new experience is being prepared.</p>
    </div>

    <script>
        // Script to update the time in the top right corner to add subtle life to the page
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('time').innerText = timeString;
        }
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
