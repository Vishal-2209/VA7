[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va7-identity"
version = "0.1.0"
description = "VA7 Identity — Authentication, authorization, and user management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "VA7 Team" }]
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "va7-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests", "tests/testapp"]
