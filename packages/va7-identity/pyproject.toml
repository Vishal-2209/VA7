[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va7-identity"
version = "0.1.0"
description = "VA7 Identity — Authentication, authorization, and user management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "VA7 Team" }]
keywords = ["django", "saas", "authentication", "authorization", "rbac", "jwt", "otp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "va7-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Vishal-2209/va7"
Repository = "https://github.com/Vishal-2209/va7"

[tool.hatch.build.targets.wheel]
packages = ["va7"]

[tool.pytest.ini_options]
pythonpath = ["tests", "tests/testapp"]
