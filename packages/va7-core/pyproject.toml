[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "va7-core"
version = "0.1.0"
description = "VA7 Framework — Foundation layer for Django SaaS applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vishal Aidasani" }]
keywords = ["django", "saas", "framework", "base-model", "middleware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django>=5.1,<7.0",
    "djangorestframework>=3.15",
    "dj-database-url>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/Vishal-2209/va7"
Repository = "https://github.com/Vishal-2209/va7"

[tool.hatch.build.targets.wheel]
packages = ["va7"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
